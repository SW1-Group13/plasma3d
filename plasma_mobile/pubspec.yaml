name: plasma_mobile
description: "Plasma3D Mobile - de planos 2D a modelos 3D con IA."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev


version: 1.0.0+1
environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  # PAQUETES DE LA APLICACION 
  cupertino_icons: ^2.0.0
  model_viewer_plus: ^1.9.3
  shared_preferences: ^2.5.3
  provider: ^6.1.5+1
  google_fonts: ^9.0.0
  get: ^4.6.6
  get_storage: ^2.1.1
  share_plus: ^13.3.1
  camera: ^0.12.2
  image_picker: ^1.2.0
  url_launcher: ^6.3.2
  http: ^1.6.0
  firebase_core: ^5.2.0
  firebase_messaging: ^17.1.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


# The following section is specific to Flutter packages.
flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/models/
 