services:
  web:
    build: ./plasma3d_api/
    container_name: django_backend
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=plasma_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=071104
      - CORS_ALLOWED_ORIGINS=http://localhost:4000,http://angular-app:4000
    env_file:
      - ./.env
    volumes:
      - ./plasma3d_api:/app
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    depends_on:
      - angular-app
    networks:
      - backend
      - frontend
    command: >
      sh -c "python manage.py makemigrations users plans presupuesto suggestion_risk view_url_3D &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  angular-app:
    build: ./plasma3d_web/
    container_name: angular_frontend
    ports:
      - "4000:4000"
    environment:
      - API_URL=http://web:8000
    networks:
      - frontend
      - backend

networks:
  backend:
    external: true
  frontend:
    driver: bridge
