# ==========================================================
# plasma3d-nginx - reverse proxy (API Django + Frontend Angular SSR)
# ==========================================================

upstream plasma3d_api {
    server plasma3d-api:8000;
}

upstream plasma3d_web {
    server plasma3d-web:4000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 100M;

    # --- API Django ---
    location /api/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Archivos media subidos (planos, glb, imagenes) ---
    location /media/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    # --- Estaticos de Django (admin / DRF) ---
    location /static/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Frontend Angular SSR ---
    location / {
        proxy_pass http://plasma3d_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }
}
