# ==========================================================
# plasma3d-nginx - Punto de entrada HTTPS
# Dominio: https://plasma3d.sebaces.fyi
#
# Certificados Let's Encrypt (montados desde el host):
#   /etc/letsencrypt/live/plasma3d.sebaces.fyi/fullchain.pem
#   /etc/letsencrypt/live/plasma3d.sebaces.fyi/privkey.pem
#
# Renovacion con webroot:
#   /var/www/certbot (en el contenedor)
#   ./nginx/certbot-www (en el host)
#
# Pasos completos en nginx/HTTPS.md.
# ==========================================================

server_tokens off;

upstream plasma3d_api {
    server plasma3d-api:8000;
}

upstream plasma3d_web {
    server plasma3d-web:5173;
}

# --- HTTP: reto ACME + redireccion a HTTPS ---
server {
    listen 80;
    server_name plasma3d.sebaces.fyi;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS ---
server {
    listen 443 ssl;
    http2 on;
    server_name plasma3d.sebaces.fyi;

    ssl_certificate     /etc/letsencrypt/live/plasma3d.sebaces.fyi/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plasma3d.sebaces.fyi/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 100M;

    # --- API Django ---
    location /api/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # --- Archivos media subidos (planos, glb, imagenes) ---
    location /media/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # --- Estaticos de Django ---
    location /static/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # --- WebSocket ---
    location /ws/ {
        proxy_pass http://plasma3d_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }

    # --- Frontend SPA (React + Vite servido por nginx) ---
    location / {
        proxy_pass http://plasma3d_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;
    }
}
