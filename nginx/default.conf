# ==========================================================
# plasma3d-nginx - Punto de entrada HTTP (sin HTTPS)
# IP publica: http://54.89.10.236
# Dominio:    http://plasma3d.sebaces.fyi
# ==========================================================

server_tokens off;

upstream plasma3d_api {
    server plasma3d-api:8000;
}

upstream plasma3d_web {
    server plasma3d-web:5173;
}

server {
    listen 80 default_server;
    server_name 54.89.10.236 plasma3d.sebaces.fyi _;

    client_max_body_size 100M;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Agente IA en streaming (SSE): sin buffer.
    location /api/suggestion_risk/agente/stream/ {
        proxy_pass http://plasma3d_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /api/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /media/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 600s;
    }

    location /static/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
    }

    location /ws/ {
        proxy_pass http://plasma3d_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 600s;
    }

    location / {
        proxy_pass http://plasma3d_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 600s;
    }
}
