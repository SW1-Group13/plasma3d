name: plasma3d-dev

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-071104}
      POSTGRES_DB: ${POSTGRES_DB:-plasma_db}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plasma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plasma3d

  plasma3d-api:
    image: sebastiandevjs/plasma3d_api:dev
    build:
      context: ./plasma3d_api
      dockerfile: Dockerfile.dev
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: "True"
    volumes:
      - ./plasma3d_api:/app
    ports:
      - "8000:8000"
    stdin_open: true
    tty: true
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plasma3d
    command: >
      sh -c "python manage.py makemigrations users plans presupuesto suggestion_risk view_url_3D catalog &&
             python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"

  plasma3d-web:
    image: sebastiandevjs/plasma3d_web:dev
    build:
      context: ./plasma3d_web
      dockerfile: Dockerfile.dev
    environment:
      FRONTEND_PORT: 5173
      VITE_BASE_URL: http://plasma3d-api:8000
      # Hot-reload con polling (Docker en Windows/macOS)
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "800"
      WATCHPACK_POLLING: "true"
    volumes:
      - ./plasma3d_web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - plasma3d-api
    networks:
      - plasma3d

networks:
  plasma3d:
    driver: bridge

volumes:
  pgdata:
  web_node_modules:
