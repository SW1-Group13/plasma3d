# ==========================================================
# plasma3d-web - SPA (Nginx) + proxy a la API Django
# ==========================================================

upstream plasma3d_api {
    server plasma3d-api:8000;
}

server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 100M;

    # --- API Django (^~ para que gane a la regla de estaticos por extension) ---
    location ^~ /api/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location ^~ /media/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location ^~ /static/ {
        proxy_pass http://plasma3d_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- PWA: service worker y manifest SIN cache (si no, los celulares no
    #     reciben las versiones nuevas). Van antes de la regla de assets. ---
    location ~* ^/(?:sw\.js|registerSW\.js|workbox-[^/]+\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # --- Assets con cache ---
    location ~* \.(?:js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico|glb|webp)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        try_files $uri =404;
    }

    # --- SPA: cualquier ruta desconocida vuelve a index.html ---
    location / {
        try_files $uri $uri/ /index.html;
    }
}
