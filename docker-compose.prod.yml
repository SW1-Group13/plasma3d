name: plasma3d-prod

services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-071104}
      POSTGRES_DB: ${POSTGRES_DB:-plasma_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plasma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plasma3d

  plasma3d-api:
    image: sebastiandevjs/plasma3d_api:prod
    build:
      context: ./plasma3d_api
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: "False"
      # Produccion: el frontend se sirve desde el dominio HTTPS.
      CORS_ALLOWED_ORIGINS: https://plasma3d.sebaces.fyi
      CSRF_TRUSTED_ORIGINS: https://plasma3d.sebaces.fyi,http://plasma3d.sebaces.fyi
      CSRF_COOKIE_SECURE: "True"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plasma3d

  plasma3d-web:
    image: sebastiandevjs/plasma3d_web:prod
    build:
      context: ./plasma3d_web
      dockerfile: Dockerfile.prod
      args:
        VITE_BASE_URL: /
    restart: always
    # Solo accesible desde la red interna; el borde es plasma3d-nginx.
    expose:
      - "5173"
    depends_on:
      - plasma3d-api
    networks:
      - plasma3d

  plasma3d-nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Certificados emitidos en el host con certbot.
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Retos ACME para renovacion (webroot).
      - ./nginx/certbot-www:/var/www/certbot:ro
    # Recarga nginx cada 6 h para tomar certificados renovados.
    command:
      - /bin/sh
      - -c
      - |
        while :; do sleep 6h; nginx -s reload; done &
        nginx -g 'daemon off;'
    depends_on:
      - plasma3d-api
      - plasma3d-web
    networks:
      - plasma3d

networks:
  plasma3d:
    driver: bridge

volumes:
  pgdata:
  media_data:
