name: plasma3d-prod

services:
  postgres:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-071104}
      POSTGRES_DB: ${POSTGRES_DB:-plasma_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-plasma_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - plasma3d

  plasma3d-api:
    build:
      context: ./plasma3d_api
      dockerfile: Dockerfile.prod
    restart: always
    env_file:
      - ./.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: "False"
      ALLOWED_HOSTS: "*"
    volumes:
      - media_data:/app/media
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - plasma3d

  plasma3d-web:
    build:
      context: ./plasma3d_web
      dockerfile: Dockerfile.prod
      args:
        ENDPOINT: ${PROD_ENDPOINT:-https://app.bratox.me/}
        CLOUDINARY: ${CLOUDINARY:-https://api.cloudinary.com/v1_1}
    restart: always
    environment:
      PORT: 4000
      API_URL: http://plasma3d-api:8000
    depends_on:
      - plasma3d-api
    networks:
      - plasma3d

  plasma3d-nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - plasma3d-api
      - plasma3d-web
    networks:
      - plasma3d

networks:
  plasma3d:
    driver: bridge

volumes:
  pgdata:
  media_data:
